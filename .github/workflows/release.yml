name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set the app version from the tag
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}" --prefix apps/desktop
      - name: Build the app
        run: pnpm --filter @vmc/desktop package:win
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: apps/desktop/release/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      - name: Set the app version from the tag
        run: npm pkg set version="${GITHUB_REF_NAME#v}" --prefix apps/desktop
      - name: Build the app
        run: pnpm --filter @vmc/desktop package
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
