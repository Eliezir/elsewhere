appId: dev.elsewhere.app
productName: Elsewhere
directories:
  output: release
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  identity: null
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  extendInfo:
    LSUIElement: false
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
dmg:
  title: Elsewhere
artifactName: Elsewhere-${version}-${arch}.${ext}
