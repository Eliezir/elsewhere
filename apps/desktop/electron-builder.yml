appId: dev.elsewhere.app
productName: Elsewhere
directories:
  output: release
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  identity: null
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  extendInfo:
    LSUIElement: false
dmg:
  title: Elsewhere
artifactName: Elsewhere-${version}-${arch}.${ext}
